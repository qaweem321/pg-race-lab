# A throwaway Postgres for `npm run verify:postgres` (the same version CI uses):
#   docker compose up -d
#   DATABASE_URL=postgres://lab:lab@localhost:5439/lab npm run verify:postgres
#   docker compose down
# The lab itself needs no database: it runs entirely in the browser.

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      retries: 20
